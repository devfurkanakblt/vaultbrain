name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installers:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run quality
      - run: npm run quality:rust
      - run: npm run tauri:build
      - name: Require Authenticode credentials for stable releases
        if: startsWith(github.ref, 'refs/tags/v1.')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "Stable v1 releases require WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD secrets."
          }
      - name: Authenticode-sign Windows installers
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            Write-Host 'Authenticode credentials are absent; leaving this pre-1.0 test artifact unsigned.'
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'vault-brain-authenticode.pfx'
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $installers = Get-ChildItem src-tauri/target/release/bundle -Recurse -File -Include *.msi,*.exe
            if (-not $installers) { throw 'No Windows installers were produced.' }
            foreach ($installer in $installers) {
              & signtool sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD $installer.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($installer.Name)." }
              & signtool verify /pa /all $installer.FullName
              if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $($installer.Name)." }
            }
          } finally {
            if (Test-Path -LiteralPath $certificatePath) {
              Remove-Item -LiteralPath $certificatePath -Force
            }
          }
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle -Recurse -File -Include *.msi,*.exe |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path.Replace((Get-Location).Path + '\\', ''))" } |
            Set-Content -Encoding ascii src-tauri/target/release/bundle/checksums.sha256
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: src-tauri/target/release/bundle/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-checksums: src-tauri/target/release/bundle/checksums.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vault-brain-windows-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/checksums.sha256
            src-tauri/target/release/bundle/sbom.spdx.json
