name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npx prettier --check eslint.config.js package.json tsconfig.json desktop/tsconfig.json desktop/vite.config.ts src-tauri/tauri*.conf.json src-tauri/capabilities/main.json .github
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:platform-artifacts
      - run: npm run test:release
      - run: npm run test:update-acceptance
      - run: npm run desktop:test
      - run: npm run desktop:build
      - run: npm run benchmark
      - run: npm run recovery:drill
      - run: npm run benchmark:10k
      - run: npm run benchmark:100k
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - run: npm run package:check

  # The product performance budgets that are not met yet, enforced strictly and
  # on their own.
  #
  # This job was expected to be RED until Phase 17 (incremental index
  # persistence) landed, because a single-note save re-serialized and
  # re-encrypted the whole index and so missed the "< 20 ms incremental save
  # acknowledgement" budget in docs/PRODUCT.md. Phase 17 closed that: the save
  # path is now flat in vault size and the budget passes in both cores.
  #
  # It is deliberately separate from `typescript` so a miss is visible as a
  # real failure rather than a tolerated warning, while merges stay unblocked.
  # It can now be added to the repository's required status checks, which is
  # the last item Phase 17 is holding open. Relaxing a budget to turn this
  # green is not an option — the whole point of splitting it out is that the
  # number stays honest.
  performance-budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The desktop benchmark links the same crate the app does, so it needs
      # the same system libraries the `rust` job installs.
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y             build-essential             libayatana-appindicator3-dev             librsvg2-dev             libssl-dev             libwebkit2gtk-4.1-dev             libxdo-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: npm run benchmark:budgets
      # The desktop core's save path. Every budget in docs/PRODUCT.md is a
      # desktop interaction, so measuring only the TypeScript library left the
      # number the contract is about unmeasured until Phase 17.
      - run: npm run benchmark:rust
      # The tier the budget is actually written for. Slow -- it writes 100k
      # encrypted objects in each core -- so it runs on main rather than on
      # every pull request, the same way benchmark:100k does.
      - run: npm run benchmark:100k
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - run: npm run benchmark:rust -- --notes 100000
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

  node-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run desktop:test

  rust:
    permissions:
      contents: read
      # rustsec/audit-check publishes its report as a check run on push events,
      # which the workflow-wide read-only token cannot create.
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-15
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev
      - run: npm ci
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432
        if: runner.os == 'Linux'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
      - run: npm run tauri:build
      - name: Validate native bundle artifacts
        run: node scripts/platform-artifacts.mjs --platform ${{ matrix.platform }}
      - name: Verify the synthetic two-version native package transition
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            windows)
              targets=(windows-msi windows-nsis)
              ;;
            macos)
              targets=(macos-dmg)
              ;;
            linux)
              targets=(linux-deb)
              ;;
          esac
          for target in "${targets[@]}"; do
            node scripts/release/native-update-acceptance.mjs \
              --platform "${{ matrix.platform }}" \
              --target "$target" \
              --bundle-dir src-tauri/target/release/bundle \
              --vault-dir test/fixtures/keyring-v2
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vault-brain-${{ matrix.platform }}-${{ github.sha }}
          if-no-files-found: error
          path: src-tauri/target/release/bundle

  native-keychain:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exercise Windows DPAPI or macOS Keychain
        if: runner.os != 'Linux'
        run: npm run test:native-keychain
        env:
          VBRAIN_REQUIRE_NATIVE_KEYCHAIN: "1"
      - name: Exercise Linux Secret Service
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dbus-x11 gnome-keyring libsecret-tools
          dbus-run-session -- bash -euo pipefail -c '
            eval "$(printf "\\n" | gnome-keyring-daemon --unlock --components=secrets)"
            npm run test:native-keychain
          '
        env:
          VBRAIN_REQUIRE_NATIVE_KEYCHAIN: "1"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # Required since gitleaks-action v2: without it the action exits
          # before scanning anything, which is what it has been doing here.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@5ba2889ada762081db2c4f32a729827dce632c7b # v3
