[default]
description = "No custom vault commands are granted implicitly."
permissions = []

[[permission]]
identifier = "allow-pick-vault-directory"
description = "Allows the main local window to open the native folder chooser and receive only the selected path."
commands.allow = ["pick_vault_directory"]

[[permission]]
identifier = "allow-unlock-vault"
description = "Allows the main local window to unlock one explicitly supplied vault path."
commands.allow = ["unlock_vault"]

[[permission]]
identifier = "allow-lock-vault"
description = "Allows the main local window to zeroize and close its current vault session."
commands.allow = ["lock_vault"]

[[permission]]
identifier = "allow-list-notes"
description = "Allows listing decrypted note summaries only after unlock."
commands.allow = ["list_notes"]

[[permission]]
identifier = "allow-get-note"
description = "Allows decrypting one explicitly referenced note after unlock."
commands.allow = ["get_note"]

[[permission]]
identifier = "allow-save-note"
description = "Allows updating one note in the unlocked vault."
commands.allow = ["save_note"]

[[permission]]
identifier = "allow-create-note"
description = "Allows creating one note at a validated logical Markdown path."
commands.allow = ["create_note"]

[[permission]]
identifier = "allow-rename-note"
description = "Allows moving or retitling one note at a validated logical Markdown path."
commands.allow = ["rename_note"]

[[permission]]
identifier = "allow-delete-note"
description = "Allows removing one note's object while keeping its encrypted history for recovery."
commands.allow = ["delete_note"]

[[permission]]
identifier = "allow-list-deleted-notes"
description = "Allows listing notes that still have encrypted history but no live object."
commands.allow = ["list_deleted_notes"]

[[permission]]
identifier = "allow-list-note-revisions"
description = "Allows listing the archived and live revisions of one referenced note."
commands.allow = ["list_note_revisions"]

[[permission]]
identifier = "allow-get-note-revision"
description = "Allows decrypting one archived revision of one referenced note."
commands.allow = ["get_note_revision"]

[[permission]]
identifier = "allow-restore-note-revision"
description = "Allows writing one archived revision forward as the note's new revision."
commands.allow = ["restore_note_revision"]

[[permission]]
identifier = "allow-list-templates"
description = "Allows listing the notes the unlocked vault marks as templates."
commands.allow = ["list_templates"]

[[permission]]
identifier = "allow-create-from-template"
description = "Allows creating one note by rendering a template's body and properties."
commands.allow = ["create_from_template"]

[[permission]]
identifier = "allow-open-daily-note"
description = "Allows opening, or first creating, the daily note for one calendar date."
commands.allow = ["open_daily_note"]

[[permission]]
identifier = "allow-list-plugins"
description = "Allows listing installed plugins, their versions and the capabilities they declared."
commands.allow = ["list_plugins"]

[[permission]]
identifier = "allow-authorize-plugin-instance"
description = "Allows the main local window to obtain a revision-bound token for one enabled plugin worker."
commands.allow = ["authorize_plugin_instance"]

[[permission]]
identifier = "allow-plugin-call"
description = "Allows a token-bound plugin call whose live capability and revocation policy is revalidated in Rust."
commands.allow = ["plugin_call"]

[[permission]]
identifier = "allow-get-plugin"
description = "Allows reading one plugin's manifest and source so the sandbox worker can be built."
commands.allow = ["get_plugin"]

[[permission]]
identifier = "allow-get-plugin-security-policy"
description = "Allows reading restricted mode and locally revoked signer key IDs."
commands.allow = ["get_plugin_security_policy"]

[[permission]]
identifier = "allow-set-plugin-restricted-mode"
description = "Allows switching the unlocked vault between consent mode and signed-only restricted mode."
commands.allow = ["set_plugin_restricted_mode"]

[[permission]]
identifier = "allow-revoke-plugin-signer"
description = "Allows blocking the verified signer of one installed plugin in this vault."
commands.allow = ["revoke_plugin_signer"]

[[permission]]
identifier = "allow-restore-plugin-signer"
description = "Allows removing one signer key ID from this vault's local revocation list."
commands.allow = ["restore_plugin_signer"]

[[permission]]
identifier = "allow-install-plugin"
description = "Allows storing one plugin's manifest and source, encrypted, in the unlocked vault."
commands.allow = ["install_plugin"]

[[permission]]
identifier = "allow-set-plugin-enabled"
description = "Allows turning one installed plugin on or off."
commands.allow = ["set_plugin_enabled"]

[[permission]]
identifier = "allow-delete-plugin"
description = "Allows removing one plugin and the settings it owns from the unlocked vault."
commands.allow = ["delete_plugin"]

[[permission]]
identifier = "allow-get-plugin-storage"
description = "Allows reading one plugin's own encrypted settings namespace."
commands.allow = ["get_plugin_storage"]

[[permission]]
identifier = "allow-set-plugin-storage"
description = "Allows writing one plugin's own encrypted settings namespace."
commands.allow = ["set_plugin_storage"]

[[permission]]
identifier = "allow-search-notes"
description = "Allows searching the already-unlocked encrypted index."
commands.allow = ["search_notes"]

[[permission]]
identifier = "allow-get-backlinks"
description = "Allows reading backlinks for one explicitly referenced note."
commands.allow = ["get_backlinks"]

[[permission]]
identifier = "allow-get-knowledge-graph"
description = "Allows reading value-free note and resolved-link topology from the unlocked encrypted index."
commands.allow = ["get_knowledge_graph"]

[[permission]]
identifier = "allow-list-property-rows"
description = "Allows reading typed properties for the unlocked vault's local table view."
commands.allow = ["list_property_rows"]

[[permission]]
identifier = "allow-update-note-property"
description = "Allows replacing or clearing one typed property on one referenced note in the unlocked vault."
commands.allow = ["update_note_property"]

[[permission]]
identifier = "allow-list-saved-views"
description = "Allows reading the encrypted saved property queries of the unlocked vault."
commands.allow = ["list_saved_views"]

[[permission]]
identifier = "allow-save-saved-view"
description = "Allows storing one saved property query in the unlocked vault."
commands.allow = ["save_saved_view"]

[[permission]]
identifier = "allow-delete-saved-view"
description = "Allows removing one saved property query from the unlocked vault."
commands.allow = ["delete_saved_view"]

[[permission]]
identifier = "allow-get-workspace-state"
description = "Allows reading the encrypted bookmarks and saved layouts of the unlocked vault."
commands.allow = ["get_workspace_state"]

[[permission]]
identifier = "allow-save-workspace-state"
description = "Allows storing bookmarks and saved layouts in the unlocked vault."
commands.allow = ["save_workspace_state"]

[[permission]]
identifier = "allow-get-unlinked-mentions"
description = "Allows listing notes that name one referenced note without linking it."
commands.allow = ["get_unlinked_mentions"]

[[permission]]
identifier = "allow-link-unlinked-mention"
description = "Allows rewriting one source note so its plain-text mentions become links."
commands.allow = ["link_unlinked_mention"]

[[permission]]
identifier = "allow-list-canvases"
description = "Allows reading canvas names and node counts from the unlocked vault."
commands.allow = ["list_canvases"]

[[permission]]
identifier = "allow-get-canvas"
description = "Allows decrypting one explicitly referenced canvas after unlock."
commands.allow = ["get_canvas"]

[[permission]]
identifier = "allow-save-canvas"
description = "Allows writing one canvas at a validated logical path in the unlocked vault."
commands.allow = ["save_canvas"]

[[permission]]
identifier = "allow-delete-canvas"
description = "Allows removing one canvas from the unlocked vault while keeping its encrypted history."
commands.allow = ["delete_canvas"]

[[permission]]
identifier = "allow-add-attachment"
description = "Allows storing one content-addressed, chunk-encrypted attachment in the unlocked vault."
commands.allow = ["add_attachment"]

[[permission]]
identifier = "allow-read-attachment"
description = "Allows decrypting one explicitly referenced attachment after unlock."
commands.allow = ["read_attachment"]

[[permission]]
identifier = "allow-list-attachments"
description = "Allows reading attachment names, types and sizes from the unlocked vault."
commands.allow = ["list_attachments"]

[[permission]]
identifier = "allow-delete-attachment"
description = "Allows removing one attachment and every chunk it owns from the unlocked vault."
commands.allow = ["delete_attachment"]

[[permission]]
identifier = "allow-sync-status"
description = "Allows read-only visibility into device enrollment, the active epoch, checkpoint freshness and change counts. Never decrypts a change envelope or unwraps an epoch key."
commands.allow = ["sync_status"]

[[permission]]
identifier = "allow-sync-verify-registry"
description = "Allows verifying the owner's Ed25519 signature over the encrypted sync device registry. Read-only: cannot enroll, revoke or rotate."
commands.allow = ["sync_verify_registry"]
