[package]
name = "secondbrain-vault-desktop"
version = "0.2.0"
description = "Local-first encrypted knowledge workspace"
authors = ["SecondBrain Vault contributors"]
edition = "2021"

[lib]
name = "secondbrain_vault_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
ed25519-dalek = "2.1.1"
hmac = "0.12.1"
rand = "0.8.5"
regex = "1.12.2"
scrypt = "0.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = { version = "2.11.1", features = [] }
unicode-normalization = "0.1.24"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
zeroize = "1.8.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
